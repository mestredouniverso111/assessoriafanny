<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhamento Nutricional | Fanny Viana</title>
<meta name="description" content="Aplicação para o acompanhamento nutricional com Fanny Viana. Online ou presencial em Fortaleza. Leva menos de 1 minuto.">
<meta name="theme-color" content="#FFFCF7">
<link rel="icon" href="https://www.fannyviana.com.br/assets/logo/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#FF5843; --marrom:#754C24; --marrom-escuro:#3B2412; --branco:#FFFFFF;
  --creme:#FFEEE8; --marfim:#FFFCF7; --aurora:linear-gradient(#FFE3DA,#FFF9F4);
  --serif:"DM Serif Display",Georgia,serif;
  --sans:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  --script:"Mrs Saint Delafield","Allura",cursive;
  --raio-card:24px; --raio-pilula:128px; --coluna:480px;
  --mola:cubic-bezier(.34,1.56,.64,1); --suave:cubic-bezier(.22,1,.36,1); --vai-volta:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--marfim); color:var(--marrom); font-family:var(--sans);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{ /* aurora de fundo */
  content:""; position:fixed; inset:0 0 auto 0; height:60vh; background:var(--aurora);
  z-index:-1; mask:linear-gradient(#000 30%,transparent); -webkit-mask:linear-gradient(#000 30%,transparent);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:var(--coluna);margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column}

/* ---------- topo: progresso ---------- */
.topo{display:flex;align-items:center;gap:12px;min-height:44px;opacity:0;transform:translateY(-8px);transition:opacity .5s,transform .5s var(--suave);pointer-events:none}
.topo.on{opacity:1;transform:none;pointer-events:auto}
.voltar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--creme);color:var(--marrom);transition:transform .25s var(--mola),background .2s}
.voltar:hover{background:#ffe3da}
.voltar:active{transform:scale(.9)}
.voltar svg{width:18px;height:18px}
.barra{flex:1;height:6px;border-radius:6px;background:var(--creme);overflow:hidden}
.barra i{display:block;height:100%;width:0;border-radius:6px;background:var(--coral);transition:width .7s var(--suave)}
.contador{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--marrom);min-width:34px;text-align:right}

/* ---------- telas ---------- */
.palco{flex:1;position:relative;display:grid}
.tela{grid-area:1/1;display:flex;flex-direction:column;padding:12px 0 24px}
.tela::before,.tela::after{content:"";flex:1 1 0}/* centraliza sem cortar o topo quando a tela é maior que o celular */
.tela[hidden]{display:none}
.tela.sai{animation:tela-sai .38s var(--vai-volta) both}
.tela.sai.volta{animation-name:tela-sai-volta}
@keyframes tela-sai{to{opacity:0;transform:translateY(-24px);filter:blur(6px)}}
@keyframes tela-sai-volta{to{opacity:0;transform:translateY(24px);filter:blur(6px)}}

/* ---------- capa (boas-vindas) ---------- */
.capa{position:relative;border-radius:28px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(59,36,18,.55);isolation:isolate;aspect-ratio:4/3.7;background:var(--creme);flex:0 0 auto}
.capa img.foto{width:100%;height:100%;object-fit:cover;object-position:50% 20%;animation:capa-aproxima 16s ease-in-out infinite alternate}
.capa::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(rgba(59,36,18,0),rgba(59,36,18,.85));z-index:1}
.capa::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.45);border-radius:20px;z-index:2;pointer-events:none}
.capa-txt{position:absolute;left:26px;right:26px;bottom:24px;z-index:3;color:var(--branco)}
.nome{display:flex;align-items:center;gap:10px}
.nome-texto{font-family:var(--serif);font-weight:400;font-size:clamp(38px,11vw,50px);line-height:1;letter-spacing:-.03em;animation:nome-entra 1.1s var(--suave) .15s both}
.nome-logo{width:30px;height:30px;animation:logo-entra 1s var(--mola) .6s both,logo-flutua 4.5s ease-in-out 1.6s infinite}
.apoio{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.45);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--creme);animation:apoio-revela 1.3s var(--vai-volta) .8s both}
@keyframes capa-aproxima{to{transform:scale(1.07)}}
@keyframes nome-entra{0%{opacity:0;transform:translateY(14px);letter-spacing:.04em;filter:blur(6px)}100%{opacity:1;transform:none;letter-spacing:-.03em;filter:blur(0)}}
@keyframes logo-entra{0%{opacity:0;transform:scale(0) rotate(-140deg)}100%{opacity:1;transform:none}}
@keyframes logo-flutua{0%,100%{translate:0}50%{translate:0 -3px}}
@keyframes apoio-revela{0%{clip-path:inset(0 100% 0 0);opacity:.2}100%{clip-path:inset(0);opacity:1}}

.etiqueta{margin:28px auto 0;width:fit-content;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(100deg,var(--coral) 40%,#ffb4a6 50%,var(--coral) 60%);background-size:250% 100%;background-position:100% 0;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:etiqueta-entra 1.4s var(--suave) both,etiqueta-brilho 1.6s ease-in-out 1.2s both}
@keyframes etiqueta-entra{0%{opacity:0;letter-spacing:.18em;filter:blur(5px);transform:translateY(8px)}100%{opacity:1;letter-spacing:.06em;filter:blur(0);transform:none}}
@keyframes etiqueta-brilho{0%{background-position:100% 0}100%{background-position:0 0}}

.titulo{font-family:var(--serif);font-weight:400;color:var(--marrom-escuro);font-size:clamp(32px,9vw,42px);line-height:1.08;letter-spacing:-.03em;text-align:center;margin-top:10px;text-wrap:balance}
.texto{margin-top:16px;font-size:16px;line-height:1.55;color:var(--marrom);text-align:center;text-wrap:pretty}
.texto + .texto{margin-top:10px}
.texto b{font-weight:700;color:var(--marrom-escuro)}
.selo{display:inline-flex;align-items:center;gap:8px;margin:18px auto 0;padding:8px 16px;border-radius:var(--raio-pilula);background:var(--creme);font-size:13px;font-weight:600;color:var(--marrom)}
.selo svg{width:15px;height:15px;color:var(--coral)}

/* palavras que entram (título das perguntas) */
.palavra{display:inline-block;opacity:0;animation:chamada-palavra .8s var(--suave) both;transform-origin:50% 100%}
@keyframes chamada-palavra{0%{opacity:0;transform:translateY(.55em) rotateX(70deg);filter:blur(6px)}100%{opacity:1;transform:none;filter:blur(0)}}
.sobe{opacity:0;animation:sobe .8s var(--suave) both}
@keyframes sobe{0%{opacity:0;transform:translateY(14px);filter:blur(4px)}100%{opacity:1;transform:none;filter:blur(0)}}

/* ---------- botão ---------- */
.botao{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:58px;margin-top:28px;padding:12px 32px;border-radius:var(--raio-pilula);background:var(--marrom);color:var(--branco);font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:background-color .2s,transform .25s var(--mola),opacity .3s}
.botao svg{width:18px;height:18px;color:var(--coral);transition:transform .2s;animation:seta-chama 2.6s ease-in-out 1.5s infinite}
.botao:hover{background:var(--marrom-escuro)}
.botao:hover svg{transform:translateX(4px)}
.botao:active{transform:scale(.97)}
.botao::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%);animation:brilho-botao 3.2s ease-in-out 2s infinite}
.botao[disabled]{opacity:.45;pointer-events:none}
.botao[disabled]::after{display:none}
@keyframes seta-chama{0%,70%,100%{translate:0}80%{translate:4px}90%{translate:0}}
@keyframes brilho-botao{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ---------- pergunta ---------- */
.num{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--coral)}
.num::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--coral);transform-origin:left;animation:fio-entra .7s var(--vai-volta) both}
@keyframes fio-entra{from{transform:scaleX(0)}}
.pergunta{font-family:var(--serif);font-weight:400;color:var(--marrom-escuro);font-size:clamp(28px,7.6vw,36px);line-height:1.12;letter-spacing:-.02em;margin-top:14px;perspective:600px;text-wrap:balance}
.obs{margin-top:12px;font-size:14px;line-height:1.5;color:var(--marrom);opacity:.85}

.campo{position:relative;margin-top:26px}
.campo input{width:100%;min-height:62px;padding:16px 22px;border-radius:32px;border:1.5px solid transparent;background:var(--creme);font-family:var(--sans);font-size:17px;font-weight:500;color:var(--marrom-escuro);outline:none;transition:border-color .25s,background .25s,box-shadow .25s}
.campo input::placeholder{color:rgba(117,76,36,.45)}
.campo input:focus{background:var(--branco);border-color:var(--coral);box-shadow:0 10px 30px -18px rgba(255,88,67,.7)}
.campo.com-arroba input{padding-left:46px}
.campo .arroba{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-weight:600;color:var(--coral);font-size:17px}
.erro{min-height:20px;margin-top:10px;padding-left:22px;font-size:13px;font-weight:500;color:var(--coral);opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s}
.erro.on{opacity:1;transform:none}
.treme{animation:treme .4s}
@keyframes treme{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.dica{margin-top:4px;padding-left:22px;font-size:12px;color:rgba(117,76,36,.6)}
.dica kbd{font-family:var(--sans);font-weight:600}

/* opções */
.opcoes{display:flex;flex-direction:column;gap:10px;margin-top:24px;list-style:none}
.opcao{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:14px 18px;border-radius:var(--raio-card);background:var(--creme);text-align:left;font-size:15px;font-weight:600;line-height:1.35;color:var(--marrom);border:1.5px solid transparent;
  opacity:0;animation:area-entra .7s cubic-bezier(.22,1.2,.36,1) both;transition:background-color .25s,border-color .25s,transform .3s var(--mola),box-shadow .25s}
.opcao:hover{background:#ffe5dc;transform:translateX(4px)}
.opcao:active{transform:scale(.98)}
.opcao .marca{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(117,76,36,.35);display:grid;place-items:center;transition:border-color .25s,background .25s}
.opcao .marca::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--branco);transform:scale(0);transition:transform .35s var(--mola)}
.opcao .sub{display:block;margin-top:2px;font-size:12.5px;font-weight:500;opacity:.75}
.opcao.sel{background:var(--branco);border-color:var(--coral);color:var(--marrom-escuro);box-shadow:0 12px 28px -18px rgba(255,88,67,.8)}
.opcao.sel .marca{background:var(--coral);border-color:var(--coral)}
.opcao.sel .marca::after{transform:scale(1)}
.opcao.sel::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--coral);animation:onda-opcao .7s var(--suave) both;pointer-events:none}
@keyframes onda-opcao{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}
@keyframes area-entra{0%{opacity:0;transform:translateY(22px) scale(.94)}100%{opacity:1;transform:none}}
.outro-campo{overflow:hidden;max-height:0;opacity:0;transition:max-height .5s var(--suave),opacity .4s,margin .4s}
.outro-campo.on{max-height:180px;opacity:1;margin-top:4px}

.nota{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:14px 16px;border-radius:18px;background:rgba(255,238,232,.6);font-size:13px;line-height:1.5;color:var(--marrom)}
.nota svg{flex:0 0 auto;width:18px;height:18px;margin-top:1px;color:var(--coral)}

/* divisor animado (igual ao biolink) */
.divisor{display:block;width:240px;max-width:72%;height:32px;margin:0 auto;overflow:visible;color:var(--coral)}
.divisor .fio{fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.divisor .fio-eco{stroke-width:.75;opacity:.45}
.divisor .ponto,.divisor .onda,.divisor .ponta{transform-box:fill-box;transform-origin:center}
.divisor .ponto{fill:currentColor;transform:scale(0)}
.divisor .onda{fill:none;stroke:currentColor;stroke-width:.8;opacity:0}
.divisor .ponta{fill:currentColor;opacity:0;transform:scale(.2)}
.divisor.ativo .ponto{transform:scale(1);transition:transform .7s var(--mola);animation:respirar 3.6s ease-in-out 1.6s infinite}
.divisor.ativo .onda{animation:onda 1.8s var(--suave) .25s both}
.divisor.ativo .fio{stroke-dashoffset:0;transition:stroke-dashoffset 1.6s var(--vai-volta) .3s}
.divisor.ativo .fio-eco{transition-delay:.52s;transition-duration:1.8s}
.divisor.ativo .ponta{opacity:1;transform:scale(1);transition:opacity .5s 1.6s,transform .6s var(--mola) 1.6s}
@keyframes onda{0%{opacity:.7;transform:scale(.4)}100%{opacity:0;transform:scale(2.6)}}
@keyframes respirar{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}

/* tela final */
.check{position:relative;width:88px;height:88px;margin:0 auto 22px;border-radius:50%;background:var(--coral);display:grid;place-items:center;animation:logo-entra .9s var(--mola) both;box-shadow:0 18px 40px -16px rgba(255,88,67,.8)}
.check::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--coral);animation:onda 1.8s var(--suave) .5s 2 both}
.check svg{width:40px;height:40px;color:var(--branco)}
.check path{stroke-dasharray:1;stroke-dashoffset:1;animation:traco .7s var(--vai-volta) .55s forwards}
@keyframes traco{to{stroke-dashoffset:0}}
.assinatura{display:block;margin-top:18px;text-align:center;font-family:var(--script);font-size:clamp(46px,13vw,60px);line-height:1.1;color:var(--coral)}
.assinatura span{display:inline-block;clip-path:inset(-10% 100% -20% -10%);animation:escrever 2.4s cubic-bezier(.45,.05,.35,1) 1.2s forwards}
@keyframes escrever{to{clip-path:inset(-10% -20% -20% -10%)}}
.botao.longo{text-transform:none;letter-spacing:0;font-size:15px;padding:12px 26px}
.botao.claro{background:var(--creme);color:var(--marrom)}
.botao.claro:hover{background:#ffe3da}
.botao.claro::after{display:none}

.enviando{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.pontos{display:flex;gap:8px}
.pontos i{width:10px;height:10px;border-radius:50%;background:var(--coral);animation:pula 1s var(--vai-volta) infinite}
.pontos i:nth-child(2){animation-delay:.15s}.pontos i:nth-child(3){animation-delay:.3s}
@keyframes pula{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-10px);opacity:1}}

.rodape{margin-top:auto;padding-top:20px;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(117,76,36,.55)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .divisor .fio{stroke-dashoffset:0}.divisor .ponto,.divisor .ponta{opacity:1;transform:none}
  .assinatura span{clip-path:none}
}
</style>
</head>
<body>
<main class="app">
  <header class="topo" id="topo">
    <button class="voltar" id="voltar" aria-label="Voltar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="barra"></i></div>
    <span class="contador" id="contador"></span>
  </header>
  <div class="palco" id="palco"></div>
  <p class="rodape">Fanny Viana · Nutrição</p>
</main>

<script>
/* =========================================================
   CONFIGURAÇÃO
   ENVIO_URL: para onde vão as aplicações. "/api/consulta-nutricional/lead" = função
   da Cloudflare, que guarda no D1 e mostra em /consulta-nutricional-admin.
   ========================================================= */
const ENVIO_URL = "/api/consulta-nutricional/lead";
const INSTAGRAM_URL = "https://instagram.com/fanny_viana";
const FOTO = "https://www.fannyviana.com.br/assets/img/fanny-headline-v2-800.webp";
const LOGO = "https://www.fannyviana.com.br/assets/img/fv-claro-128.webp";

const PERGUNTAS = [
  { id:"nome", tipo:"texto", titulo:"Pra começar, qual é o seu nome completo?", placeholder:"Seu nome completo", autocomplete:"name" },
  { id:"whatsapp", tipo:"telefone", titulo:"{NOME}, qual é o seu WhatsApp?", obs:"Obs: é por ele que eu vou falar com você.", placeholder:"(85) 99999-9999" },
  { id:"instagram", tipo:"instagram", titulo:"E o seu @ no Instagram, caso a gente não se encontre pelo WhatsApp?", placeholder:"seuperfil" },
  { id:"objetivo", tipo:"lista", titulo:"{NOME}, qual é o principal objetivo que você quer alcançar com o meu acompanhamento?", opcoes:[
      "Emagrecer e melhorar minha composição corporal.",
      "Ganhar massa muscular.",
      "Melhorar minha performance nos treinos ou no esporte.",
      "Melhorar minha relação com a comida.",
      "Cuidar da minha saúde intestinal.",
      ["Cuidar da saúde da mulher.","Ciclo, hormônios, endometriose, SOP, lipedema, gestação, perimenopausa, menopausa."],
      ["Ter acompanhamento para uma condição específica de saúde.","Como diabetes, hipertensão, colesterol alto…"],
      "Outro objetivo."
    ], outro:"Outro objetivo." },
  { id:"modalidade", tipo:"lista", titulo:"Como você prefere ser atendida?", opcoes:[
      "Online",
      ["Presencial","Fortaleza – Ceará"],
      "Tanto faz, quero a que fizer mais sentido pra mim."
    ], nota:"O valor é o mesmo nas duas. A avaliação física acontece nas duas modalidades, ambas validadas e padrão ouro." },
  { id:"prazo", tipo:"lista", titulo:"{NOME}, em quanto tempo você gostaria de começar?", opcoes:[
      "O quanto antes.","Ainda este mês.","Nos próximos 3 meses.","Ainda estou só pesquisando."
    ] }
];

/* ---------- estado ---------- */
const respostas = {};
let passo = -1; // -1 = boas-vindas
const palco = document.getElementById("palco");
const topo = document.getElementById("topo");
const params = new URLSearchParams(location.search);

const seta = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const divisorSVG = `<svg class="divisor" viewBox="0 0 240 32" aria-hidden="true">
  <path class="fio" pathLength="1" d="M111 16 C 98 11.5, 88 20.5, 74 16 S 50 11.5, 36 16 S 20 18.5, 12 16"/>
  <path class="fio" pathLength="1" d="M129 16 C 142 20.5, 152 11.5, 166 16 S 190 20.5, 204 16 S 220 13.5, 228 16"/>
  <path class="fio fio-eco" pathLength="1" d="M108 19.5 C 96 22, 86 17, 72 20 S 52 22.5, 42 20"/>
  <path class="fio fio-eco" pathLength="1" d="M132 12.5 C 144 10, 154 15, 168 12 S 188 9.5, 198 12"/>
  <circle class="ponta" cx="7" cy="16" r="1.6"/><circle class="ponta" cx="233" cy="16" r="1.6"/>
  <circle class="onda" cx="120" cy="16" r="5"/><circle class="ponto" cx="120" cy="16" r="4.5"/></svg>`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const primeiroNome = () => {
  const n = (respostas.nome || "").trim().split(/\s+/)[0] || "";
  return n ? n.charAt(0).toUpperCase() + n.slice(1).toLowerCase() : "";
};
const comNome = t => t.replace("{NOME}", esc(primeiroNome()));
const palavras = (html, atraso = 0) => {
  let i = 0;
  return html.split(" ").map(p => `<span class="palavra" style="animation-delay:${atraso + (i++) * 45}ms">${p}</span>`).join(" ");
};
const ativarDivisores = el => requestAnimationFrame(() => setTimeout(() => el.querySelectorAll(".divisor").forEach(d => d.classList.add("ativo")), 60));

/* ---------- transição entre telas ---------- */
function trocar(html, volta = false, depois) {
  const atual = palco.querySelector(".tela");
  const montar = () => {
    palco.innerHTML = `<section class="tela">${html}</section>`;
    const tela = palco.querySelector(".tela");
    ativarDivisores(tela);
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
    depois && depois(tela);
  };
  if (!atual) return montar();
  atual.classList.add("sai"); if (volta) atual.classList.add("volta");
  setTimeout(montar, 340);
}

function atualizarTopo() {
  const total = PERGUNTAS.length;
  const on = passo >= 0 && passo < total;
  topo.classList.toggle("on", on);
  document.getElementById("barra").style.width = on ? ((passo + 1) / total * 100) + "%" : (passo >= total ? "100%" : "0");
  document.getElementById("contador").textContent = on ? `${passo + 1}/${total}` : "";
}

/* ---------- boas-vindas ---------- */
function boasVindas(volta) {
  passo = -1; atualizarTopo();
  trocar(`
    <figure class="capa sobe" style="animation-delay:0ms">
      <img class="foto" src="${FOTO}" alt="Fanny Viana" fetchpriority="high">
      <figcaption class="capa-txt">
        <div class="nome"><span class="nome-texto">Fanny Viana</span><img class="nome-logo" src="${LOGO}" alt=""></div>
        <p class="apoio">Acompanhamento nutricional</p>
      </figcaption>
    </figure>
    <p class="etiqueta">Online ou presencial</p>
    <h1 class="titulo">${palavras("Que bom te ver por aqui!", 350)}</h1>
    <p class="texto sobe" style="animation-delay:700ms">Esse é o caminho para começar seu <b>acompanhamento nutricional</b> comigo.</p>
    <p class="texto sobe" style="animation-delay:850ms">Online ou presencial, com um plano construído a partir da sua rotina, dos seus objetivos e da sua história.</p>
    <span class="selo sobe" style="animation-delay:1000ms">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Você leva menos de 1 minuto
    </span>
    <button class="botao sobe" style="animation-delay:1150ms" id="comecar">Quero começar ${seta}</button>
  `, volta, tela => tela.querySelector("#comecar").onclick = () => irPara(0));
}

/* ---------- perguntas ---------- */
function irPara(i, volta = false) {
  passo = i; atualizarTopo();
  if (i >= PERGUNTAS.length) return enviar();
  const q = PERGUNTAS[i];
  let corpo = "";
  const valor = respostas[q.id] || "";

  if (q.tipo === "texto" || q.tipo === "telefone" || q.tipo === "instagram") {
    const attrs = q.tipo === "telefone"
      ? `type="tel" inputmode="tel" autocomplete="tel-national" maxlength="16"`
      : q.tipo === "instagram"
        ? `type="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off"`
        : `type="text" autocomplete="${q.autocomplete}" autocapitalize="words"`;
    corpo = `
      <div class="campo ${q.tipo === "instagram" ? "com-arroba" : ""} sobe" style="animation-delay:450ms">
        ${q.tipo === "instagram" ? '<span class="arroba">@</span>' : ""}
        <input id="entrada" ${attrs} placeholder="${q.placeholder}" value="${esc(valor)}" aria-label="${esc(q.titulo.replace("{NOME}, ", ""))}">
      </div>
      <p class="erro" id="erro" role="alert"></p>
      <button class="botao sobe" style="animation-delay:600ms" id="ok">Continuar ${seta}</button>
      <p class="dica sobe" style="animation-delay:750ms">ou aperte <kbd>Enter ↵</kbd></p>`;
  } else {
    corpo = `<ul class="opcoes">` + q.opcoes.map((o, k) => {
      const [t, sub] = Array.isArray(o) ? o : [o, ""];
      const sel = valor === t ? " sel" : "";
      return `<li><button class="opcao${sel}" data-v="${esc(t)}" style="animation-delay:${380 + k * 70}ms">
        <span class="marca"></span><span>${esc(t)}${sub ? `<span class="sub">${esc(sub)}</span>` : ""}</span></button></li>`;
    }).join("") + `</ul>`;
    if (q.outro) corpo += `
      <div class="outro-campo ${valor === q.outro ? "on" : ""}" id="outroBox">
        <div class="campo" style="margin-top:12px"><input id="outro" type="text" placeholder="Me conta qual é o seu objetivo" value="${esc(respostas[q.id + "_outro"] || "")}"></div>
        <p class="erro" id="erro" role="alert"></p>
        <button class="botao" id="ok" style="margin-top:14px">Continuar ${seta}</button>
      </div>`;
    if (q.nota) corpo += `<p class="nota sobe" style="animation-delay:${400 + q.opcoes.length * 70}ms">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>${esc(q.nota)}</p>`;
  }

  trocar(`
    <p class="num">Pergunta ${i + 1}</p>
    <h2 class="pergunta">${palavras(comNome(q.titulo), 80)}</h2>
    ${q.obs ? `<p class="obs sobe" style="animation-delay:350ms">${esc(q.obs)}</p>` : ""}
    ${corpo}
  `, volta, tela => ligar(tela, q, i));
}

function mostrarErro(tela, msg) {
  const e = tela.querySelector("#erro"); if (!e) return;
  e.textContent = msg; e.classList.add("on");
  const c = tela.querySelector(".campo"); if (c) { c.classList.remove("treme"); void c.offsetWidth; c.classList.add("treme"); }
}

function mascaraTel(v) {
  const d = v.replace(/\D/g, "").slice(0, 11);
  if (d.length <= 2) return d.length ? `(${d}` : "";
  if (d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}

function ligar(tela, q, i) {
  const entrada = tela.querySelector("#entrada");
  const ok = tela.querySelector("#ok");

  if (entrada) {
    setTimeout(() => entrada.focus({ preventScroll: true }), 500);
    if (q.tipo === "telefone") entrada.addEventListener("input", () => { entrada.value = mascaraTel(entrada.value); });
    if (q.tipo === "instagram") entrada.addEventListener("input", () => { entrada.value = entrada.value.replace(/^@+/, "").replace(/\s/g, ""); });
    entrada.addEventListener("input", () => tela.querySelector("#erro").classList.remove("on"));
    const avancar = () => {
      let v = entrada.value.trim();
      if (q.tipo === "texto") {
        if (v.length < 3) return mostrarErro(tela, "Me conta seu nome, por favor.");
        if (v.split(/\s+/).length < 2) return mostrarErro(tela, "Coloca seu nome completo, com sobrenome.");
      }
      if (q.tipo === "telefone") {
        const d = v.replace(/\D/g, "");
        if (d.length < 10 || d.length > 11) return mostrarErro(tela, "Confere o número com DDD, por favor.");
      }
      if (q.tipo === "instagram") {
        v = v.replace(/^@+/, "").replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").replace(/\/.*$/, "");
        if (!/^[A-Za-z0-9._]{1,30}$/.test(v)) return mostrarErro(tela, "Coloca só o seu @, sem espaços.");
      }
      respostas[q.id] = v;
      irPara(i + 1);
    };
    ok.onclick = avancar;
    entrada.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); avancar(); } });
    return;
  }

  // listas
  const botoes = tela.querySelectorAll(".opcao");
  const outroBox = tela.querySelector("#outroBox");
  const outro = tela.querySelector("#outro");
  let travado = false;
  botoes.forEach(b => b.onclick = () => {
    if (travado) return;
    botoes.forEach(x => x.classList.remove("sel"));
    b.classList.add("sel");
    const v = b.dataset.v;
    respostas[q.id] = v;
    if (q.outro && v === q.outro) {
      outroBox.classList.add("on");
      setTimeout(() => { outro.focus({ preventScroll: true }); outroBox.scrollIntoView({ behavior: "smooth", block: "center" }); }, 250);
      return;
    }
    if (outroBox) { outroBox.classList.remove("on"); delete respostas[q.id + "_outro"]; }
    travado = true;
    setTimeout(() => irPara(i + 1), 420);
  });
  if (outro) {
    const avancarOutro = () => {
      const v = outro.value.trim();
      if (v.length < 3) return mostrarErro(tela, "Me conta rapidinho qual é o seu objetivo.");
      respostas[q.id + "_outro"] = v;
      irPara(i + 1);
    };
    ok.onclick = avancarOutro;
    outro.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); avancarOutro(); } });
  }
}

document.getElementById("voltar").onclick = () => passo <= 0 ? boasVindas(true) : irPara(passo - 1, true);

/* ---------- envio ---------- */
async function enviar() {
  atualizarTopo();
  trocar(`<div class="enviando"><div class="pontos"><i></i><i></i><i></i></div>
    <p class="texto sobe">Enviando sua aplicação…</p></div>`);

  const digits = (respostas.whatsapp || "").replace(/\D/g, "");
  const payload = {
    nome: respostas.nome,
    primeiro_nome: primeiroNome(),
    whatsapp: digits ? "+55" + digits : "",
    whatsapp_formatado: respostas.whatsapp,
    instagram: respostas.instagram ? "@" + respostas.instagram : "",
    objetivo: respostas.objetivo,
    objetivo_outro: respostas.objetivo_outro || "",
    modalidade: respostas.modalidade,
    prazo: respostas.prazo,
    utm_source: params.get("utm_source") || "",
    utm_medium: params.get("utm_medium") || "",
    utm_campaign: params.get("utm_campaign") || "",
    utm_content: params.get("utm_content") || "",
    utm_term: params.get("utm_term") || "",
    pagina: location.href.split("?")[0],
    referencia: document.referrer || "",
    enviado_em: new Date().toISOString()
  };

  const minimo = new Promise(r => setTimeout(r, 1100));
  const tentar = () => fetch(ENVIO_URL, {
    method: "POST", keepalive: true,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(r => { if (!r.ok) throw new Error("status " + r.status); });
  let deu = true;
  try { await tentar(); } catch { try { await new Promise(r => setTimeout(r, 800)); await tentar(); } catch (e) { deu = false; console.warn("Falha no envio", e); } }
  await minimo;
  if (!deu) return falhou();
  window.dataLayer && window.dataLayer.push({ event: "quiz_enviado" });
  if (typeof window.fbq === "function") window.fbq("track", "Lead");
  final();
}

function falhou() {
  trocar(`
    <h2 class="titulo">${palavras("Ops, sua aplicação não foi enviada.", 100)}</h2>
    <p class="texto sobe" style="animation-delay:400ms">${location.protocol === "file:"
      ? "O quiz foi aberto direto do arquivo, sem o servidor. Abra pelo endereço <b>fannyviana.com.br/consulta-nutricional</b>."
      : "Parece que a conexão falhou. Suas respostas continuam aqui, é só tentar de novo."}</p>
    <button class="botao sobe" style="animation-delay:550ms" id="denovo">Tentar de novo ${seta}</button>
  `, false, tela => tela.querySelector("#denovo").onclick = enviar);
}

function final() {
  const nome = esc(primeiroNome());
  trocar(`
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 class="titulo">${palavras(`Aplicação recebida${nome ? ", " + nome : ""}!`, 250)}</h2>
    <div style="margin-top:18px" class="sobe" >${divisorSVG}</div>
    <p class="texto sobe" style="animation-delay:600ms"><b>Eu mesma vou ler com atenção tudo o que você me contou.</b></p>
    <p class="texto sobe" style="animation-delay:750ms">Em até 24 horas te chamo no WhatsApp para entender melhor o seu momento e conversar com você para analisarmos juntas qual acompanhamento faz mais sentido pra você.</p>
    <p class="assinatura" aria-label="Até já já. Abraços!"><span>Até já já. Abraços!</span></p>
    <a class="botao longo sobe" style="animation-delay:1500ms;text-decoration:none" href="${INSTAGRAM_URL}" target="_blank" rel="noopener">Enquanto isso, me acompanha no Instagram ${seta}</a>
  `);
}

boasVindas();
</script>
